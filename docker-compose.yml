name: baratex

x-app-env: &app-env
  APP_NAME: "BARATEX API"
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8000}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr

  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-baratex_db}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_SSLMODE: disable

  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
  JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-1440}

  SESSION_DRIVER: array
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local

  # "log" = sem WebSocket real. Use "reverb" + --profile realtime p/ chat ao vivo.
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  REVERB_APP_ID: ${REVERB_APP_ID:-baratex}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-baratex-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-baratex-secret}
  REVERB_HOST: reverb          # o app fala com o reverb pela rede interna do Docker
  REVERB_PORT: 8080
  REVERB_SCHEME: http

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: baratex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-baratex_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: baratex-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@baratex.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin

  app:
    build:
      context: .
    container_name: baratex-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - storage:/var/www/html/storage

  # Opcional: docker compose --profile realtime up -d
  reverb:
    profiles: ["realtime"]
    build:
      context: .
    container_name: baratex-reverb
    restart: unless-stopped
    depends_on:
      - app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    ports:
      - "${REVERB_FORWARD_PORT:-8080}:8080"

volumes:
  pgdata:
  pgadmin:
  storage:
